# Runs on every push and pull request. Free on GitHub for public repositories.
# The CSV is not in the repo, so tests that need it skip; retraining happens locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Confirm no data file is in the repo
        run: |
          if [ -n "$(git ls-files '*.csv')" ]; then echo "CSV files must not be committed:"; git ls-files '*.csv'; exit 1; fi
      - name: Run tests (data-dependent tests skip)
        run: python -m pytest -q -rs

  docker:
    name: Docker image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t used-car-pricing-api .
      - name: Start the container
        run: docker run -d --name api -p 8000:8000 used-car-pricing-api
      - name: Smoke test /health and /predict
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health | python3 -c "import json,sys; assert json.load(sys.stdin)['status'] == 'ok'"
          curl -sf -X POST http://localhost:8000/predict -H "Content-Type: application/json" \
               -d @examples/predict_request.json | tee response.json
          python3 -c "import json; r = json.load(open('response.json')); assert r['range']['low'] <= r['estimate'] <= r['range']['high']; assert r['deal']['verdict'] in ('below range', 'fair', 'overpriced'); assert len(r['reasons']) == 6"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
                 -H "Content-Type: application/json" -d '{"make_model": "Tesla", "age": 9, "km": 1}')
          test "$code" = "422"
      - name: Container logs (if anything failed)
        if: failure()
        run: docker logs api
